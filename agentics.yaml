# gestionmoney -- profile for the agentics pipeline.
#
# Run from the agentics checkout, for example:
#   ./agentics run --project /mnt/data2/DiskG/MEGA/Code/gestionmoney/agentics.yaml \
#     --runtime claude-code --mission <slug> --bugs "<symptom>"

name: gestionmoney
project:
  root: .
  source_globs:
    - "src/**/*.ts"
    - "src/**/*.tsx"
    # The Vercel serverless endpoints: OAuth, session, cookies. Production source.
    - "api/**/*.ts"
  exclude:
    - "node_modules/**"
    - "**/node_modules/**"
    - "dist/**"
    # A gitignored Python virtualenv: 21 672 third-party files, 127 vendored
    # Prisma migration .sql. The security walk is tree-wide, not glob-scoped,
    # so without this it audits litellm instead of this app (run_9874f8aa7d).
    - ".venv/**"
    - "venv/**"
    - "__pycache__/**"
    # Tests are found through the parser's own patterns, not as source.
    - "**/*.test.ts"
    - "**/*.test.tsx"

tests:
  # `--no`: npx refuses to install anything not already in node_modules.
  authoritative: "npx --no vitest run"
  # The guard check re-runs this against a reverted tree. 430 tests, 39s, no jsdom.
  fast: "npx --no vitest run src/lib api/_lib"
  parser: jest
  # Placeholders only. Two auth tests need these names set; the real values
  # live in .env and must never be copied here -- every role can read this file.
  env:
    VITE_GOOGLE_CLIENT_ID: test-client
    VITE_GOOGLE_API_KEY: test-key

roles: {}

# A worktree checkout holds only tracked files. node_modules is gitignored, so
# without this `npx --no vitest run` finds no vitest and every run fails
# G-TEST-EXIT. Symlinked, never copied: removing the checkout leaves it intact.
worktree_links: [node_modules]

# Product decisions already made. Sent to every agent with the task, so no
# stage parks a run to ask them again. Keep it to decisions (max 4000 bytes).
rulings: agentics-rulings.md

knowledge_base:
  root: /mnt/data2/DiskG/MEGA/Code/secondbrain
  domains: [general]

# Outside the repository, so run reports never show up in git status.
reports: ../gestionmoney-agentic-reports
